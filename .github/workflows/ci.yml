name: CI Pipeline — Lumix Auto Studio

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonación del Repositorio
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Requerido por SonarQube para el análisis del historial

      # 2. Configuración del Entorno Node.js
      - name: Environment Setup (Node.js v18)
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      # 3. Instalación de Dependencias
      - name: Install Dependencies
        run: npm ci

      # 4. Pruebas Unitarias e Integración con Cobertura
      - name: Run Unit Tests with Coverage
        run: npm test -- --coverage

      # 5. Análisis Estático de Código con SonarQube / SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 6. Notificación Vía Webhook en Caso de Fallo (Discord / Slack)
      - name: Notify Pipeline Failure via Webhook
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚨 **ALERTA DE PIPELINE CI — LUMIX AUTO STUDIO**\n**Estado:** FALLIDO ❌\n**Rama:** `${{ github.ref_name }}`\n**Commiter:** `${{ github.actor }}`\n**Detalles:** El build, las pruebas o el Quality Gate han fallado. Revisar la pestaña Actions en GitHub."}' \
               ${{ secrets.WEBHOOK_URL }}